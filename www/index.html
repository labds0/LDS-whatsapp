<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرسل واتساب</title>
<style>
  :root { --g:#128c7e; --bg:#f0f2f5; --card:#fff; --t:#111; --m:#667781; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#111b21; --card:#202c33; --t:#e9edef; --m:#8696a0; } }
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);
    padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px)}
  h1{font-size:20px;margin:14px 0 8px;color:var(--g)}
  .card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
  textarea,input{width:100%;padding:10px;border:1px solid #8884;border-radius:8px;background:transparent;color:var(--t);font-size:15px;font-family:inherit}
  textarea{resize:vertical}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .row>*{flex:1}
  button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:11px 8px;font-size:15px;font-family:inherit}
  button.s{background:#8885;color:var(--t)} button.r{background:#d32f2f}
  #list{max-height:34vh;overflow-y:auto}
  .it{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid #8883}
  .it input{width:20px;height:20px;flex:none}
  .it span{flex:1} .it small{color:var(--m);direction:ltr}
  #st{font-size:14px;color:var(--m);min-height:20px}
  .badge{font-size:13px;padding:6px 10px;border-radius:8px;margin-bottom:8px;display:none}
  .bad{background:#d32f2f22;color:#d32f2f;display:block}
  label.l{font-size:13px;color:var(--m)}
</style>
</head>
<body>
<h1>مرسل واتساب الجماعي</h1>

<div id="acc" class="badge"></div>

<div class="card">
  <label class="l">الرسالة (استخدم {name} للاسم)</label>
  <textarea id="msg" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
  <div class="row">
    <button class="s" id="b-bold" style="font-weight:bold;max-width:60px">B</button>
    <button class="s" id="b-italic" style="font-style:italic;max-width:60px">I</button>
    <button class="s" id="b-img">📎 إرفاق صورة</button>
    <input id="imgf" type="file" accept="image/*" style="display:none">
  </div>
  <div id="imgbox" style="display:none;margin-top:6px;align-items:center;gap:8px">
    <img id="imgprev" style="max-width:90px;max-height:90px;border-radius:6px">
    <button class="s" id="b-imgdel">إزالة الصورة</button>
  </div>
  <small class="l">النص بين نجمتين *هكذا* يظهر عريض في واتساب (الصورة تُرسل والنص تعليق عليها)</small>
</div>

<div class="card">
  <label class="l">إضافة أرقام: رقم في كل سطر، أو الاسم,الرقم</label>
  <textarea id="nums" rows="3" placeholder="01012345678&#10;أحمد,01112345678&#10;@mafifi&#10;محمد,@mafifi"></textarea>
  <div class="row">
    <input id="cc" value="20" inputmode="numeric" style="max-width:90px" aria-label="كود الدولة">
    <button id="b-add">إضافة للقائمة</button>
  </div>
</div>

<div class="card">
  <div class="row" style="margin:0 0 6px"><b id="cnt">العدد: 0</b></div>
  <div id="list"></div>
  <div class="row">
    <button class="s" id="b-all">تحديد الكل</button>
    <button class="s" id="b-none">إلغاء</button>
    <button class="s" id="b-del">حذف المحدد</button>
    <button class="s" id="b-copy">نسخ الأرقام</button>
  </div>
</div>

<div class="card">
  <div class="row" style="margin:0">
    <label class="l">تأخير (ثانية) من</label><input id="dmin" type="number" value="8" min="3">
    <label class="l">إلى</label><input id="dmax" type="number" value="15" min="3">
  </div>
  <div class="row" style="margin:6px 0">
    <label class="l">الإرسال من</label>
    <select id="wapp"><option value="biz">واتساب بيزنس</option><option value="reg">واتساب العادي</option></select>
  </div>
  <div class="row">
    <button id="b-sendsel">إرسال للمحدد</button>
    <button id="b-sendall">إرسال للكل</button>
    <button class="r" id="b-stop">إيقاف</button>
  </div>
  <div class="row"><button class="s" id="b-acc">تفعيل خدمة الوصول (مرة واحدة)</button></div>
  <p id="st">جاهز</p>
</div>

<script>
const $ = id => document.getElementById(id);
function showErr(m){ const s=$('st'); if(s){ s.textContent='خطأ: '+m; s.style.color='#d32f2f'; } }
window.onerror = (msg, src, line) => { showErr(msg + ' (سطر ' + line + ')'); };
window.addEventListener('unhandledrejection', e => showErr((e.reason && e.reason.message) || e.reason));

let contacts = [];
let checked = new Set();
try { contacts = JSON.parse(localStorage.getItem('contacts') || '[]'); } catch (e) {}

// مفتاح المقارنة: اليوزرنيم (@name) بحروف صغيرة، والرقم بأرقامه فقط
function ckey(v){ v = String(v); return v.startsWith('@') ? v.toLowerCase() : v.replace(/\D/g, ''); }
// تدقيق التكرار: يحذف أي رقم مكرر تلقائياً (يُبقي أول ظهور) ويرجع عدد المحذوف
function dedupe(){
  const seen = new Set(); const before = contacts.length;
  contacts = contacts.filter(c => {
    const k = ckey(c.number);
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  const removed = before - contacts.length;
  if (removed) { const keep = new Set(contacts.map(c => c.number)); checked = new Set([...checked].filter(n => keep.has(n))); }
  return removed;
}
const removedOnLoad = dedupe();
try { $('msg').value = localStorage.getItem('message') || ''; $('wapp').value = localStorage.getItem('wapp') || 'biz'; } catch (e) {}
$('wapp').addEventListener('change', () => { try { localStorage.setItem('wapp', $('wapp').value); } catch (e) {} });
$('msg').addEventListener('input', () => { try { localStorage.setItem('message', $('msg').value); } catch (e) {} });

function persist(){ try { localStorage.setItem('contacts', JSON.stringify(contacts)); } catch (e) { showErr(e.message); } }

function normalize(raw, cc){
  raw = raw.trim();
  const um = raw.match(/^(?:https?:\/\/)?(?:wa\.me\/)?@?([A-Za-z0-9._]{3,35})$/);
  if (raw.startsWith('@') || (/wa\.me\//.test(raw) && um && /[A-Za-z]/.test(um[1]))) {
    return um && /[A-Za-z]/.test(um[1]) ? '@' + um[1].toLowerCase() : null;
  }
  let d = raw.replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  else if (d.startsWith('0')) d = cc + d.slice(1);
  else if (!d.startsWith(cc) && d.length <= 10) d = cc + d;
  return d.length >= 8 && d.length <= 15 ? d : null;
}

function render(){
  const l = $('list'); l.innerHTML = '';
  contacts.forEach(c => {
    const row = document.createElement('label'); row.className = 'it';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = checked.has(c.number);
    cb.onchange = () => cb.checked ? checked.add(c.number) : checked.delete(c.number);
    const nm = document.createElement('span'); nm.textContent = c.name || '—';
    const nu = document.createElement('small'); nu.textContent = String(c.number).startsWith('@') ? c.number : '+' + c.number;
    row.append(cb, nm, nu); l.append(row);
  });
  $('cnt').textContent = 'العدد: ' + contacts.length;
}

function addNums(){
  const cc = ($('cc').value.trim() || '20');
  const have = new Set(contacts.map(c => c.number));
  let add = 0, bad = 0, dup = 0;
  $('nums').value.split('\n').map(s => s.trim()).filter(Boolean).forEach(line => {
    const p = line.split(/[,;\t،]/).map(s => s.trim()).filter(Boolean);
    const name = p.length > 1 ? p[0] : '';
    const n = normalize(p[p.length - 1], cc);
    if (!n) bad++; else if (have.has(n)) dup++; else { have.add(n); contacts.push({name, number: n}); add++; }
  });
  dup += dedupe();
  persist(); render(); $('nums').value = '';
  $('st').style.color = ''; $('st').textContent = 'أضيف ' + add + ' | مكرر محذوف ' + dup + ' | غير صالح ' + bad;
}

function selAll(v){ checked = v ? new Set(contacts.map(c => c.number)) : new Set(); render(); }

function delSel(){
  if (!checked.size) return;
  contacts = contacts.filter(c => !checked.has(c.number));
  checked.clear(); persist(); render();
}

// نسخ المحدد (أو الكل لو لا يوجد تحديد) بصيغة الاسم,الرقم سطر لكل جهة اتصال
function copyNums(){
  const src = checked.size ? contacts.filter(c => checked.has(c.number)) : contacts;
  if (!src.length) return;
  const txt = src.map(c => (c.name ? c.name + ',' : '') + c.number).join('\n');
  const done = () => { $('st').style.color = ''; $('st').textContent = 'تم نسخ ' + src.length + ' رقم'; };
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = txt; document.body.append(t); t.select();
    try { document.execCommand('copy'); done(); } catch (e) { showErr('تعذر النسخ'); }
    t.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
}

// ---- تنسيق النص (عريض/مائل بصيغة واتساب) ----
function wrapSel(mark){
  const t = $('msg'), a = t.selectionStart, b = t.selectionEnd, v = t.value;
  const sel = v.slice(a, b);
  t.value = v.slice(0, a) + mark + sel + mark + v.slice(b);
  t.focus();
  t.setSelectionRange(a + mark.length, b + mark.length);
  t.dispatchEvent(new Event('input'));
}

// ---- صورة مرفقة: تُصغَّر وتُحفظ كـ base64 (JPEG) ----
let imageB64 = '';
function showImg(){
  $('imgbox').style.display = imageB64 ? 'flex' : 'none';
  if (imageB64) $('imgprev').src = 'data:image/jpeg;base64,' + imageB64;
}
function pickImage(file){
  if (!file) return;
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const k = Math.min(1, 1280 / Math.max(im.width, im.height));
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    imageB64 = c.toDataURL('image/jpeg', 0.85).split(',')[1];
    URL.revokeObjectURL(url);
    try { localStorage.setItem('image', imageB64); } catch (e) {}
    showImg();
  };
  im.onerror = () => showErr('تعذر قراءة الصورة');
  im.src = url;
}
try { imageB64 = localStorage.getItem('image') || ''; } catch (e) {}

// ---- الربط مع الأزرار (قبل أي شيء متعلق بالإضافة الأصلية) ----
$('b-add').addEventListener('click', addNums);
$('b-all').addEventListener('click', () => selAll(true));
$('b-none').addEventListener('click', () => selAll(false));
$('b-del').addEventListener('click', delSel);
$('b-copy').addEventListener('click', copyNums);
$('b-bold').addEventListener('click', () => wrapSel('*'));
$('b-italic').addEventListener('click', () => wrapSel('_'));
$('b-img').addEventListener('click', () => $('imgf').click());
$('imgf').addEventListener('change', e => { pickImage(e.target.files[0]); e.target.value = ''; });
$('b-imgdel').addEventListener('click', () => { imageB64 = ''; try { localStorage.removeItem('image'); } catch (e) {} showImg(); });
showImg();
$('b-sendsel').addEventListener('click', () => send(false));
$('b-sendall').addEventListener('click', () => send(true));
$('b-stop').addEventListener('click', () => stopSend());
$('b-acc').addEventListener('click', () => openAcc());
if (removedOnLoad) { persist(); $('st').textContent = 'تم حذف ' + removedOnLoad + ' رقم مكرر تلقائياً'; }
render();

// ---- الإضافة الأصلية (Android) ----
let WaBulk = null;
let isApp = false;
try {
  isApp = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
  if (window.Capacitor) WaBulk = Capacitor.Plugins.WaBulk || Capacitor.registerPlugin('WaBulk');
} catch (e) { showErr(e.message); }

function badge(ok, text){ $('acc').className = ok ? 'badge' : 'badge bad'; $('acc').textContent = ok ? '' : text; }

async function checkAcc(){
  if (!isApp || !WaBulk) { badge(false, 'يعمل داخل تطبيق الأندرويد فقط'); return false; }
  try {
    const r = await WaBulk.isAccessibilityEnabled();
    badge(r.enabled, 'خدمة الوصول غير مفعلة — اضغط "تفعيل خدمة الوصول"');
    return r.enabled;
  } catch (e) { badge(false, 'الإضافة الأصلية غير متاحة: ' + (e.message || e)); return false; }
}

async function send(all){
  const message = $('msg').value.trim();
  if (!message && !imageB64) return alert('اكتب الرسالة أو أرفق صورة أولاً');
  if (!isApp || !WaBulk) return alert('يعمل داخل تطبيق الأندرويد فقط');
  if (!(await checkAcc())) return alert('فعّل خدمة الوصول أولاً');
  const dd = dedupe(); if (dd) { persist(); render(); $('st').textContent = 'تم حذف ' + dd + ' رقم مكرر قبل الإرسال'; }
  const targets = all ? contacts : contacts.filter(c => checked.has(c.number));
  if (!targets.length) return alert('لا توجد أرقام للإرسال');
  if (!confirm('سيتم الإرسال إلى ' + targets.length + ' رقم. متابعة؟')) return;
  try {
    await WaBulk.start({ targets, message, image: imageB64, app: $('wapp').value, min: +$('dmin').value || 8, max: +$('dmax').value || 15 });
  } catch (e) { showErr(e.message || e); }
}

function stopSend(){ if (WaBulk) WaBulk.stop().catch(e => showErr(e.message)); }
function openAcc(){
  if (!WaBulk) return alert('يعمل داخل تطبيق الأندرويد فقط');
  WaBulk.openAccessibilitySettings().catch(e => showErr(e.message || e));
}

try {
  if (isApp && WaBulk) {
    WaBulk.addListener('status', s => { $('st').style.color = ''; $('st').textContent = s.text; });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkAcc(); });
    WaBulk.isAccessibilityEnabled().then(r => { if (r.text) $('st').textContent = r.text; }).catch(() => {});
  }
} catch (e) { showErr(e.message); }
checkAcc();
</script>
</body>
</html>
