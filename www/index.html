<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرسل واتساب</title>
<style>
  :root { --g:#128c7e; --bg:#f0f2f5; --card:#fff; --t:#111; --m:#667781; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#111b21; --card:#202c33; --t:#e9edef; --m:#8696a0; } }
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);
    padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px)}
  h1{font-size:20px;margin:14px 0 8px;color:var(--g)}
  .card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
  textarea,input{width:100%;padding:10px;border:1px solid #8884;border-radius:8px;background:transparent;color:var(--t);font-size:15px;font-family:inherit}
  textarea{resize:vertical}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .row>*{flex:1}
  button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:11px 8px;font-size:15px;font-family:inherit}
  button.s{background:#8885;color:var(--t)} button.r{background:#d32f2f}
  #list{max-height:34vh;overflow-y:auto}
  .it{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid #8883}
  .it input{width:20px;height:20px;flex:none}
  .it span{flex:1} .it small{color:var(--m);direction:ltr}
  #st{font-size:14px;color:var(--m);min-height:20px}
  .badge{font-size:13px;padding:6px 10px;border-radius:8px;margin-bottom:8px;display:none}
  .bad{background:#d32f2f22;color:#d32f2f;display:block}
  label.l{font-size:13px;color:var(--m)}
</style>
</head>
<body>
<h1>مرسل واتساب الجماعي</h1>

<div id="acc" class="badge"></div>

<div class="card">
  <label class="l">الرسالة (استخدم {name} للاسم)</label>
  <textarea id="msg" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
</div>

<div class="card">
  <label class="l">إضافة أرقام: رقم في كل سطر، أو الاسم,الرقم</label>
  <textarea id="nums" rows="3" placeholder="01012345678&#10;أحمد,01112345678"></textarea>
  <div class="row">
    <input id="cc" value="20" inputmode="numeric" style="max-width:90px" aria-label="كود الدولة">
    <button onclick="addNums()">إضافة للقائمة</button>
  </div>
</div>

<div class="card">
  <div class="row" style="margin:0 0 6px"><b id="cnt">العدد: 0</b></div>
  <div id="list"></div>
  <div class="row">
    <button class="s" onclick="selAll(true)">تحديد الكل</button>
    <button class="s" onclick="selAll(false)">إلغاء</button>
    <button class="s" onclick="delSel()">حذف المحدد</button>
  </div>
</div>

<div class="card">
  <div class="row" style="margin:0">
    <label class="l">تأخير (ثانية) من</label><input id="dmin" type="number" value="8" min="3">
    <label class="l">إلى</label><input id="dmax" type="number" value="15" min="3">
  </div>
  <div class="row">
    <button onclick="send(false)">إرسال للمحدد</button>
    <button onclick="send(true)">إرسال للكل</button>
    <button class="r" onclick="stopSend()">إيقاف</button>
  </div>
  <div class="row"><button class="s" onclick="openAcc()">تفعيل خدمة الوصول (مرة واحدة)</button></div>
  <p id="st">جاهز</p>
</div>

<script>
const isApp = window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
const WaBulk = window.Capacitor ? Capacitor.registerPlugin('WaBulk') : null;
const $ = id => document.getElementById(id);

let contacts = [];
let checked = new Set();
try { contacts = JSON.parse(localStorage.getItem('contacts') || '[]'); } catch (e) {}
$('msg').value = localStorage.getItem('message') || '';
$('msg').addEventListener('input', () => localStorage.setItem('message', $('msg').value));

function persist(){ localStorage.setItem('contacts', JSON.stringify(contacts)); }

function normalize(raw, cc){
  let d = raw.replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  else if (d.startsWith('0')) d = cc + d.slice(1);
  else if (!d.startsWith(cc) && d.length <= 10) d = cc + d;
  return d.length >= 8 && d.length <= 15 ? d : null;
}

function render(){
  const l = $('list'); l.innerHTML = '';
  contacts.forEach(c => {
    const row = document.createElement('label'); row.className = 'it';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = checked.has(c.number);
    cb.onchange = () => cb.checked ? checked.add(c.number) : checked.delete(c.number);
    const nm = document.createElement('span'); nm.textContent = c.name || '—';
    const nu = document.createElement('small'); nu.textContent = '+' + c.number;
    row.append(cb, nm, nu); l.append(row);
  });
  $('cnt').textContent = 'العدد: ' + contacts.length;
}

function addNums(){
  const cc = $('cc').value.trim() || '20';
  const have = new Set(contacts.map(c => c.number));
  let add = 0, bad = 0;
  $('nums').value.split('\n').map(s => s.trim()).filter(Boolean).forEach(line => {
    const p = line.split(/[,;\t،]/).map(s => s.trim()).filter(Boolean);
    const name = p.length > 1 ? p[0] : '';
    const n = normalize(p[p.length - 1], cc);
    if (!n) bad++; else if (!have.has(n)) { have.add(n); contacts.push({name, number: n}); add++; }
  });
  persist(); render(); $('nums').value = '';
  $('st').textContent = `أضيف ${add} | غير صالح ${bad}`;
}

function selAll(v){ checked = v ? new Set(contacts.map(c => c.number)) : new Set(); render(); }

function delSel(){
  if (!checked.size) return;
  contacts = contacts.filter(c => !checked.has(c.number));
  checked.clear(); persist(); render();
}

async function checkAcc(){
  if (!isApp) { $('acc').className = 'badge bad'; $('acc').textContent = 'يعمل داخل تطبيق الأندرويد فقط'; return; }
  const r = await WaBulk.isAccessibilityEnabled();
  $('acc').className = r.enabled ? 'badge' : 'badge bad';
  $('acc').textContent = r.enabled ? '' : 'خدمة الوصول غير مفعلة — اضغط "تفعيل خدمة الوصول"';
  return r.enabled;
}

async function send(all){
  const message = $('msg').value.trim();
  if (!message) return alert('اكتب الرسالة أولاً');
  if (!isApp) return alert('يعمل داخل تطبيق الأندرويد فقط');
  if (!(await checkAcc())) return alert('فعّل خدمة الوصول أولاً');
  const targets = all ? contacts : contacts.filter(c => checked.has(c.number));
  if (!targets.length) return alert('لا توجد أرقام للإرسال');
  if (!confirm(`سيتم الإرسال إلى ${targets.length} رقم. متابعة؟`)) return;
  try {
    await WaBulk.start({ targets, message, min: +$('dmin').value || 8, max: +$('dmax').value || 15 });
  } catch (e) { alert('خطأ: ' + (e.message || e)); }
}

function stopSend(){ if (isApp) WaBulk.stop(); }
function openAcc(){ if (isApp) WaBulk.openAccessibilitySettings(); }

if (isApp) {
  WaBulk.addListener('status', s => { $('st').textContent = s.text; });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkAcc(); });
  WaBulk.isAccessibilityEnabled().then(r => { if (r.text) $('st').textContent = r.text; });
}
render(); checkAcc();
</script>
</body>
</html>
